---
# Database server group firewall overlay.
# Uncomment during the demo to open PostgreSQL port (restricted to app subnet).

firewall_group_dict:
  allow_postgres:
    zone: public
    state: enabled
    port:
      - 5432/tcp
    rich_rule:
      - 'rule family="ipv4" source address="192.168.152.0/24" port port="5432" protocol="tcp" accept'
