# Description: Restore demo-modifiable files to their skeleton state.
# Run after a demo to reset the repository for the next session.
# Safe to commit the result for a clean starting point, or use git reset instead.
---
- name: Reset RHEL GitOps state to skeleton baseline
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - ansible.builtin

  vars:
    skeleton_map:
      - src: templates/host_vars/web-01/network.yml
        dest: host_vars/web-01/network.yml
      - src: templates/host_vars/web-01/storage.yml
        dest: host_vars/web-01/storage.yml
      - src: templates/host_vars/web-02/network.yml
        dest: host_vars/web-02/network.yml
      - src: templates/host_vars/web-02/storage.yml
        dest: host_vars/web-02/storage.yml
      - src: templates/host_vars/db-01/network.yml
        dest: host_vars/db-01/network.yml
      - src: templates/host_vars/db-01/storage.yml
        dest: host_vars/db-01/storage.yml
      - src: templates/host_vars/app-01/network.yml
        dest: host_vars/app-01/network.yml
      - src: templates/host_vars/app-01/storage.yml
        dest: host_vars/app-01/storage.yml
      - src: templates/group_vars/web_servers/firewall.yml
        dest: group_vars/web_servers/firewall.yml
      - src: templates/group_vars/web_servers/kernel_settings.yml
        dest: group_vars/web_servers/kernel_settings.yml
      - src: templates/group_vars/web_servers/storage.yml
        dest: group_vars/web_servers/storage.yml
      - src: templates/group_vars/database_servers/firewall.yml
        dest: group_vars/database_servers/firewall.yml
      - src: templates/group_vars/database_servers/kernel_settings.yml
        dest: group_vars/database_servers/kernel_settings.yml
      - src: templates/group_vars/database_servers/storage.yml
        dest: group_vars/database_servers/storage.yml
      - src: templates/group_vars/app_servers/firewall.yml
        dest: group_vars/app_servers/firewall.yml
      - src: templates/group_vars/app_servers/kernel_settings.yml
        dest: group_vars/app_servers/kernel_settings.yml
      - src: templates/group_vars/app_servers/storage.yml
        dest: group_vars/app_servers/storage.yml

  tasks:
    - name: Restore skeleton files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop: "{{ skeleton_map }}"

    - name: Report reset status
      ansible.builtin.debug:
        msg: "{{ skeleton_map | length }} demo-modifiable files restored to skeleton baseline."
