# Description: Reconcile declared RHEL state through Red Hat RHEL System Roles.
# This is the single entry point that AAP runs when the Git repo changes.
# Run: ansible-playbook site.yml
---
- name: RHEL GitOps — Declarative Fleet Reconciliation
  hosts: all
  become: true
  gather_facts: true
  collections:
    - ansible.builtin
    - redhat.rhel_system_roles

  tasks:
    - name: Transform GitOps dict variables into role-compatible lists
      ansible.builtin.import_tasks: tasks/prepare_vars.yml

    - name: Enforce Subscriptions and Insights
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.rhc

    - name: Enforce timesync (NTP/chrony)
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.timesync

    - name: Enforce network interface configuration
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.network

    - name: Enforce storage layout
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.storage

    - name: Enforce SSH hardening
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.sshd

    - name: Enforce sudo policy
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.sudo

    - name: Enforce firewall rules
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.firewall

    - name: Enforce kernel tuning
      ansible.builtin.include_role:
        name: redhat.rhel_system_roles.kernel_settings

    - name: Wait for connection to settle after network changes
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 60
